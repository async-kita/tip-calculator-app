<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32"
      href="./images/favicon-32x32.png">
    <title>Frontend Mentor | Tip calculator app</title>
    <link rel="stylesheet" href="./styles/style.css">
    <script src="./scripts/app.js" defer></script>
  </head>
  <body>
    <main class="content">
      <img
        class="logo"
        src="./images/logo.svg"
        alt="Logo Splitter"
        width="87"
        height="54">
      <section class="tip-calculator" data-js-tip-calculator>
        <h2 class="visually-hidden">Tip calculator</h2>
        <form class="tip-calculator__form tip-form" data-js-tip-calculator-form>
          <fieldset class="tip-form__field" data-js-tip-calculator-field>
            <div class="tip-form__legend-wrapper">
              <legend class="tip-form__legend font-5">Bill</legend>
              <span class="tip-form__legend-error font-5">Can’t be zero</span>
            </div>
            <label
              class="visually-hidden"
              for="input-amount">
              Total amount
            </label>
            <input
              class="tip-form__input-number input input--dollar font-3"
              id="input-amount"
              type="number"
              inputmode="decimal"
              placeholder="0"
              data-js-tip-calculate-input-amount>
          </fieldset>
          <fieldset class="tip-form__field" data-js-tip-calculator-field>
            <div class="tip-form__legend-wrapper">
              <legend class="tip-form__legend font-5">Select Tip %</legend>
            </div>
            <div class="tip-form__buttons">
              <button
                class="tip-form__button button font-3"
                type="button"
                data-js-tip-calculator-button="5">
                5%
              </button>
              <button
                class="tip-form__button button font-3"
                type="button"
                data-js-tip-calculator-button="10">
                10%
              </button>
              <button
                class="tip-form__button button font-3"
                type="button"
                data-js-tip-calculator-button="15">
                15%
              </button>
              <button
                class="tip-form__button button font-3"
                type="button"
                data-js-tip-calculator-button="25">
                25%
              </button>
              <button
                class="tip-form__button button font-3"
                type="button"
                data-js-tip-calculator-button="50">
                50%
              </button>
              <label
                class="visually-hidden"
                for="input-custom">
                Custom percent
              </label>
              <input
                class="tip-form__button input input-button font-5"
                id="input-custom"
                type="number"
                inputmode="decimal"
                placeholder="Custom"
                data-js-tip-calculator-custom>
            </div>
          </fieldset>
          <fieldset class="tip-form__field" data-js-tip-calculator-field>
            <div class="tip-form__legend-wrapper">
              <legend class="tip-form__legend font-5">Number of People</legend>
              <span class="tip-form__legend-error font-5">Can’t be zero</span>
            </div>
            <label
              class="visually-hidden"
              for="input-person">
              Total person
            </label>
            <input
              class="tip-form__input-number input input--person font-3"
              id="input-person"
              type="number"
              inputmode="decimal"
              placeholder="0"
              data-js-tip-calculate-input-person>
          </fieldset>
        </form>
        <div class="tip-form__result result-card">
          <div class="result-card__wrapper">
            <div class="result-card__item">
              <div class="result-card__label">
                <p class="result-card__title font-5">Tip Amount</p>
                <span class="result-card__subtitle font-6">/ person</span>
              </div>
              <p class="result-card__price font-2">
                $<span data-js-tip-calculator-tip-amount>0.00</span>
              </p>
            </div>
            <div class="result-card__item">
              <div class="result-card__label">
                <p class="result-card__title font-5">Total</p>
                <span class="result-card__subtitle font-6">/ person</span>
              </div>
              <p class="result-card__price font-2">
                $<span data-js-tip-calculator-total>0.00</span>
              </p>
            </div>
          </div>
          <button
            class="button-reset font-4"
            type="button"
            disabled
            data-js-tip-calculator-reset-button>
            Reset
          </button>
        </div>
      </section>
    </main>
  </body>
</html>
